name: nightly-mcts-training

# Durable, resumable Blokus MCTS self-play training.
#
# Runs every 6 hours, RESUMES from the committed durable state under training/state/,
# trains within a wall-clock budget, evaluates + (internally) promotes a candidate,
# regenerates reports, commits the updated state back to the repo, and ALWAYS emails
# a summary — on success and on failure. See docs/03-implementation/NIGHTLY_TRAINING.md.

on:
  schedule:
    # Every 6 hours at :00 (00/06/12/18 UTC) — ~20h/day of training with a ~1h
    # buffer between runs for eval, reports, commit-back, and email. The
    # `concurrency` block below queues (does not cancel) any overlap.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      approaches:
        description: "Comma-separated candidate-generation approaches to compare (or 'all')."
        required: false
        # Roster leads with the LEARNING candidates now that --refresh-data feeds them
        # fresh teacher-budget experience every run (CONTINUOUS_TRAINING_PLAN.md P1):
        # `rich_leaf` = 45-feature TD value at MCTS leaves, trained on the refreshed
        # data/td_trajectories.csv; `heuristic_tune` = Layer-6 evaluator re-fit on the
        # refreshed (post-search-fix, recency-capped) data/champion_snapshots.csv;
        # `mcts_sweep` = tuned exploration constant (no-data search probe).
        # `baseline` self-retires when identical to the champion; `policy` stays out of
        # the roster until its move-policy model is richer than the fixed heuristic it
        # currently self-distils into (see AUDIT_REPORT §7).
        default: "rich_leaf,heuristic_tune,mcts_sweep"
      games:
        description: "Games per arena per seed for approach evaluation."
        required: false
        # The benchmark pool currently creates two arenas. 5 games/arena x
        # 2 arenas x 2 pool seeds = 20 total, the SHORT eval-gate minimum
        # (training.evaluation.head_to_head.EVAL_MIN_TOTAL_GAMES). Keeping the
        # cap at the gate minimum avoids spending the whole job on one candidate.
        default: "5"
      time_budget_minutes:
        description: "Wall-clock budget in minutes for the approach-comparison run."
        required: false
        # 315 min stays under the 350-min job cap while leaving headroom for the
        # policy-target collection step (hard-capped at 15 min) plus report/commit/
        # email. Bumped from 300 so three candidates' evaluations have room; the
        # audit showed 210 min starved later candidates.
        default: "315"
      thinking_time_ms:
        description: "Uniform MCTS thinking-time override for evaluation agents."
        required: false
        # Use a faster uniform evaluator so more paired games fit the budget. The
        # sequential screen needs tens–hundreds of games to reach a conclusive SPRT
        # verdict, so per-game cost matters more than per-move strength here.
        default: "100"
      sprt_max_games:
        description: "Sequential screen: max paired games/candidate before hold (inconclusive)."
        required: false
        # Caps each candidate's SPRT at this many paired games (a fair per-candidate
        # wall-clock split also applies). A near-even candidate runs to this cap and is
        # held. 160 keeps three candidates inside the budget.
        default: "160"
      sprt_elo1:
        description: "Sequential screen H1: smallest candidate Elo edge worth promoting."
        required: false
        # CONTINUOUS_TRAINING_PLAN.md P3: with the roster now trained on fresh
        # teacher-budget data, chase smaller true edges. 70 could only confirm
        # landslides; 40 lets a real ~+40 Elo candidate reach accept_h1 within the
        # game cap instead of parking at inconclusive.
        default: "40"
      refresh_minutes:
        description: "Wall-clock cap (minutes) for the pre-eval training-data refresh."
        required: false
        # CONTINUOUS_TRAINING_PLAN.md P1: fresh teacher-budget TD trajectories +
        # evaluator snapshots from the CURRENT champion, generated before candidate
        # creation so rich_leaf/heuristic_tune train on live data. ~45 min buys
        # roughly 4-8 teacher games (~200-400 trajectory rows) plus a snapshot
        # arena per run; the corpora accumulate across runs. Set 0 to skip.
        default: "45"

# Never run two nightly trainings at once, and never cancel an in-flight run
# (cancelling mid-train could corrupt a generation). A queued run waits its turn.
concurrency:
  group: nightly-mcts-training
  cancel-in-progress: false

permissions:
  contents: write  # required to commit the updated training state back to the repo

jobs:
  train:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap a job at 360 min; stay safely under it so the
    # report/commit/email steps always get to run. For longer budgets (--hours 8+),
    # use a self-hosted runner (see NIGHTLY_TRAINING.md) and raise this limit.
    timeout-minutes: 350
    steps:
      - name: Checkout (full history for rebase-friendly commit-back)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect learned-policy targets (visit-count distillation corpus)
        if: always()
        continue-on-error: true  # never block training/reports on collection
        run: |
          # Grow data/policy_targets.csv with MCTS root visit distributions — the
          # supervised target the `policy` approach distils into the move-policy
          # PUCT prior (the expert-iteration loop). Collected at the TEACHER search
          # profile (1200 iterations + progressive widening), not a tiny flat budget:
          # visit counts from a shallow search are near-uniform noise and teach the
          # policy nothing (CONTINUOUS_TRAINING_PLAN.md P2 — the old 40 ms budget was
          # near-random). Fewer games, but every row is a real search verdict; rows
          # are flushed per-decision so the 15-min timeout keeps whatever finished.
          # The corpus accumulates across runs.
          timeout 900 python -m training.policy_selfplay \
            --num-games 4 \
            --profile teacher \
            --verbose || echo "policy target collection skipped/timed out (non-fatal)"

      - name: Run nightly training (approach-comparison framework)
        id: train
        continue-on-error: true  # reports + email must still run if training crashes
        run: |
          # Approach-comparison framework: refresh the training corpora with fresh
          # champion self-play, generate candidates from each approach, evaluate them
          # against a fixed benchmark pool with fixed seeds, and promote only a
          # candidate that passes the statistical gate. See
          # docs/03-implementation/NIGHTLY_TRAINING.md and training/README.md.
          #
          # Data refresh (--refresh-data, CONTINUOUS_TRAINING_PLAN.md P1): before
          # candidate generation, collect teacher-budget TD trajectories + evaluator
          # snapshots from the CURRENT champion (wall-clock capped) so the learning
          # approaches fit live post-search-fix data, not a frozen corpus. This is the
          # expert-iteration loop: deep-search teacher labels -> evaluator/policy fit ->
          # a sharper student next cycle. The refresh runs INSIDE the training step so
          # a single 2-core runner splits its budget explicitly (~45 min data, rest
          # train+eval); the corpora accumulate across the 4 runs/day cadence.
          # NOTE: the --thinking-time-ms eval override deliberately does NOT apply to
          # the refresh — labels must come from teacher-budget search.
          #
          # Roster: learning candidates first (they consume the refreshed data), plus
          # one search probe. `baseline` self-retires when identical to the champion.
          #
          # Evaluation: the variance-reduced SEQUENTIAL screen (--sequential-eval) — a
          # seat-balanced SPRT on the paired champion-vs-candidate outcome that stops as
          # soon as the result is conclusive (clearly better OR clearly not), so a real
          # edge is detectable in far fewer games than the old fixed 20-game screen (which
          # was swamped by the ~±72 Elo re-rating noise and could resolve nothing).
          python -m training.nightly_run \
            --approaches "${{ github.event.inputs.approaches || 'rich_leaf,heuristic_tune,mcts_sweep' }}" \
            --games "${{ github.event.inputs.games || '5' }}" \
            --time-budget-minutes "${{ github.event.inputs.time_budget_minutes || '315' }}" \
            --thinking-time-ms "${{ github.event.inputs.thinking_time_ms || '100' }}" \
            --refresh-data \
            --teacher-profile teacher \
            --refresh-minutes "${{ github.event.inputs.refresh_minutes || '45' }}" \
            --sequential-eval \
            --sprt-elo1 "${{ github.event.inputs.sprt_elo1 || '40' }}" \
            --sprt-max-games "${{ github.event.inputs.sprt_max_games || '160' }}" \
            --resume training/state/latest.json

      - name: Generate reports (always)
        if: always()
        run: |
          python -m training.status_report || true
          python -m training.diagnostics || true
          python -m training.diagnostics.audit_training_state > training/reports/training_state_audit.md || true
          # Render the champion per-game Elo trajectory PNG so it is committed with
          # the rest of the report artifacts and ready for the email to attach.
          python -m training.elo_plot || true
          # Render the extra report graphics (matchup matrix, approach comparison,
          # recent Elo deltas) so they are committed and embedded in the email too.
          python -m training.report_visuals || true

      - name: Optional Claude Code diagnostics augmentation
        if: always()
        continue-on-error: true
        run: |
          # Deterministic diagnostics already wrote training/reports/latest_diagnosis.md.
          # If an Anthropic API key is configured you can add a richer narrative here
          # (e.g. anthropics/claude-code-action). It is never required for the
          # pipeline to function, so this step is a no-op by default.
          echo "Deterministic diagnosis is the source of truth; Claude augmentation optional."

      - name: Commit durable state back to the repo
        if: always()
        run: |
          git config user.name  "mcts-nightly-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only the durable, bounded-size artifacts (per training/.gitignore the
          # bulky per-game selfplay_runs/ are excluded).
          # training/state also carries training/state/policy_weights.json (the
          # distilled move policy); data/policy_targets.csv is the growing
          # visit-count corpus the `policy` approach learns from, and
          # data/td_trajectories.csv + data/champion_snapshots.csv are the corpora
          # the --refresh-data step regenerates from the current champion each run
          # (losing them would silently re-freeze the learning approaches).
          git add training/state training/status.md training/reports training/artifacts data/champion_snapshots.csv data/td_trajectories.csv data/policy_targets.csv data/champion_registry.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "nightly training: run ${{ github.run_id }} ($(date -u +%Y-%m-%d))"
            # Be resilient to concurrent pushes on the branch.
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin "${{ github.ref_name }}" || true
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "Pushed state."
                break
              fi
              echo "Push attempt $attempt failed; retrying..."
              sleep $((2 ** attempt))
            done
          fi

      - name: Verify the report reflects the multi-agent framework (guardrail)
        if: always()
        run: |
          # Guardrail against silently shipping an old-style report: the durable
          # state MUST carry a completed approach-comparison record. If it does not
          # (e.g. the training step was cancelled / timed out before persisting its
          # result), warn loudly here — the email itself is also flagged INCOMPLETE
          # by training.email_summary. See docs/email_reporting.md.
          python -m training.verify_report_freshness || \
            echo "::warning title=Stale report::Durable state has no completed multi-agent approach comparison; the email will be flagged INCOMPLETE."

      - name: Email summary (ALWAYS — success, failure, or cancellation)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TRAINING_EMAIL_TO: ${{ secrets.TRAINING_EMAIL_TO }}
          TRAINING_EMAIL_FROM: ${{ secrets.TRAINING_EMAIL_FROM }}
        run: |
          # A true crash → failure email. A cancellation/timeout is NOT a crash but
          # also did not produce a fresh multi-agent result; email_summary's own
          # provenance guard flags those INCOMPLETE automatically (the durable state
          # lacks last_approach_comparison), so a normal compose is correct there.
          if [ "${{ steps.train.outcome }}" = "failure" ]; then
            python -m training.email_summary --failed
          else
            python -m training.email_summary
          fi

      - name: Fail the job if training did not succeed
        if: always() && steps.train.outcome != 'success'
        run: |
          echo "Training step outcome was '${{ steps.train.outcome }}' (not success);"
          echo "see logs and the failure/incomplete email."
          exit 1
