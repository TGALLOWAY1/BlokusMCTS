name: nightly-mcts-training

# Durable, resumable Blokus MCTS self-play training.
#
# Runs every 6 hours, RESUMES from the committed durable state under training/state/,
# trains within a wall-clock budget, evaluates + (internally) promotes a candidate,
# regenerates reports, commits the updated state back to the repo, and ALWAYS emails
# a summary — on success and on failure. See docs/03-implementation/NIGHTLY_TRAINING.md.

on:
  schedule:
    # Every 6 hours at :00 (00/06/12/18 UTC) — ~20h/day of training with a ~1h
    # buffer between runs for eval, reports, commit-back, and email. The
    # `concurrency` block below queues (does not cancel) any overlap.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      approaches:
        description: "Comma-separated candidate-generation approaches to compare (or 'all')."
        required: false
        # Two approaches, not four: the audit showed the budget split four ways
        # left every candidate 9-15 games against a 20-game gate. Two candidates
        # each get enough games to actually clear the screen + confirmation.
        default: "baseline,heuristic_tune"
      games:
        description: "Games per arena per seed for approach evaluation."
        required: false
        # The benchmark pool currently creates two arenas. 5 games/arena x
        # 2 arenas x 2 pool seeds = 20 total, the SHORT eval-gate minimum
        # (training.evaluation.head_to_head.EVAL_MIN_TOTAL_GAMES). Keeping the
        # cap at the gate minimum avoids spending the whole job on one candidate.
        default: "5"
      time_budget_minutes:
        description: "Wall-clock budget in minutes for the approach-comparison run."
        required: false
        # 330 min stays under the 350-min job cap while leaving report/commit/email
        # headroom. The audit showed 210 min starved later candidates.
        default: "330"
      thinking_time_ms:
        description: "Uniform MCTS thinking-time override for evaluation agents."
        required: false
        # Use a faster uniform evaluator so every approach can satisfy the
        # 20-game promotion gate. Full-strength 500 ms games exceeded the budget.
        default: "100"

# Never run two nightly trainings at once, and never cancel an in-flight run
# (cancelling mid-train could corrupt a generation). A queued run waits its turn.
concurrency:
  group: nightly-mcts-training
  cancel-in-progress: false

permissions:
  contents: write  # required to commit the updated training state back to the repo

jobs:
  train:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap a job at 360 min; stay safely under it so the
    # report/commit/email steps always get to run. For longer budgets (--hours 8+),
    # use a self-hosted runner (see NIGHTLY_TRAINING.md) and raise this limit.
    timeout-minutes: 350
    steps:
      - name: Checkout (full history for rebase-friendly commit-back)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly training (approach-comparison framework)
        id: train
        continue-on-error: true  # reports + email must still run if training crashes
        run: |
          # Approach-comparison framework: generate candidates from each approach,
          # evaluate them against a fixed benchmark pool with fixed seeds, and promote
          # only a candidate that passes the statistical gate. See
          # docs/03-implementation/NIGHTLY_TRAINING.md and training/README.md.
          python -m training.nightly_run \
            --approaches "${{ github.event.inputs.approaches || 'baseline,heuristic_tune' }}" \
            --games "${{ github.event.inputs.games || '5' }}" \
            --time-budget-minutes "${{ github.event.inputs.time_budget_minutes || '330' }}" \
            --thinking-time-ms "${{ github.event.inputs.thinking_time_ms || '100' }}" \
            --two-stage-promotion \
            --resume training/state/latest.json

      - name: Generate reports (always)
        if: always()
        run: |
          python -m training.status_report || true
          python -m training.diagnostics || true
          python -m training.diagnostics.audit_training_state > training/reports/training_state_audit.md || true
          # Render the champion per-game Elo trajectory PNG so it is committed with
          # the rest of the report artifacts and ready for the email to attach.
          python -m training.elo_plot || true
          # Render the extra report graphics (matchup matrix, approach comparison,
          # recent Elo deltas) so they are committed and embedded in the email too.
          python -m training.report_visuals || true

      - name: Optional Claude Code diagnostics augmentation
        if: always()
        continue-on-error: true
        run: |
          # Deterministic diagnostics already wrote training/reports/latest_diagnosis.md.
          # If an Anthropic API key is configured you can add a richer narrative here
          # (e.g. anthropics/claude-code-action). It is never required for the
          # pipeline to function, so this step is a no-op by default.
          echo "Deterministic diagnosis is the source of truth; Claude augmentation optional."

      - name: Commit durable state back to the repo
        if: always()
        run: |
          git config user.name  "mcts-nightly-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only the durable, bounded-size artifacts (per training/.gitignore the
          # bulky per-game selfplay_runs/ are excluded).
          git add training/state training/status.md training/reports training/artifacts data/champion_snapshots.csv data/champion_registry.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "nightly training: run ${{ github.run_id }} ($(date -u +%Y-%m-%d))"
            # Be resilient to concurrent pushes on the branch.
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin "${{ github.ref_name }}" || true
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "Pushed state."
                break
              fi
              echo "Push attempt $attempt failed; retrying..."
              sleep $((2 ** attempt))
            done
          fi

      - name: Verify the report reflects the multi-agent framework (guardrail)
        if: always()
        run: |
          # Guardrail against silently shipping an old-style report: the durable
          # state MUST carry a completed approach-comparison record. If it does not
          # (e.g. the training step was cancelled / timed out before persisting its
          # result), warn loudly here — the email itself is also flagged INCOMPLETE
          # by training.email_summary. See docs/email_reporting.md.
          python -m training.verify_report_freshness || \
            echo "::warning title=Stale report::Durable state has no completed multi-agent approach comparison; the email will be flagged INCOMPLETE."

      - name: Email summary (ALWAYS — success, failure, or cancellation)
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TRAINING_EMAIL_TO: ${{ secrets.TRAINING_EMAIL_TO }}
          TRAINING_EMAIL_FROM: ${{ secrets.TRAINING_EMAIL_FROM }}
        run: |
          # A true crash → failure email. A cancellation/timeout is NOT a crash but
          # also did not produce a fresh multi-agent result; email_summary's own
          # provenance guard flags those INCOMPLETE automatically (the durable state
          # lacks last_approach_comparison), so a normal compose is correct there.
          if [ "${{ steps.train.outcome }}" = "failure" ]; then
            python -m training.email_summary --failed
          else
            python -m training.email_summary
          fi

      - name: Fail the job if training did not succeed
        if: always() && steps.train.outcome != 'success'
        run: |
          echo "Training step outcome was '${{ steps.train.outcome }}' (not success);"
          echo "see logs and the failure/incomplete email."
          exit 1
